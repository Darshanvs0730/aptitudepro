<svg width="800" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#050505" rx="10" />
  
  <g transform="translate(250, 75)">
    <!-- Shield Outline -->
    <path d="M 0 -40 L 40 -20 L 40 10 C 40 30 20 50 0 60 C -20 50 -40 30 -40 10 L -40 -20 Z" fill="none" stroke="#B9FF66" stroke-width="3">
      <animate attributeName="stroke" values="#B9FF66;#00FF87;#B9FF66" dur="3s" repeatCount="indefinite" />
    </path>
    <!-- Inner Pulsing Shield -->
    <path d="M 0 -30 L 30 -15 L 30 10 C 30 25 15 40 0 45 C -15 40 -30 25 -30 10 L -30 -15 Z" fill="#B9FF66" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" />
    </path>
    
    <text x="60" y="0" dominant-baseline="middle" font-family="Arial" font-weight="bold" font-size="22" fill="#fff">JWT Stateless Auth</text>
    <text x="60" y="30" dominant-baseline="middle" font-family="Arial" font-weight="normal" font-size="16" fill="#888">BCrypt Password Encryption</text>
  </g>
</svg>
