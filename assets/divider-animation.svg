<svg width="100%" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="50%" stop-color="#B9FF66">
        <animate attributeName="stop-color" values="#B9FF66;#00FF87;#B9FF66" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="9" width="100%" height="2" fill="url(#lineGrad)" />
  <circle cx="0" cy="10" r="4" fill="#B9FF66">
    <animate attributeName="cx" values="0;100%;0" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
