<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B9FF66" />
      <stop offset="50%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
      <animate attributeName="x1" values="0%;200%;0%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;300%;100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a" rx="15" />
  
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="url(#grad)">
    APTITUDE PRO
  </text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="20" fill="#888888">
    <tspan fill="#B9FF66">&gt;</tspan> Master your tech interviews <tspan fill="#B9FF66">_</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
</svg>
